<!doctype html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141a13">
<title>House guide</title>
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2"); }
@font-face { font-family: "Playfair Display"; font-weight: 600; font-display: swap; src: url(fonts/playfair-display-latin-600.woff2) format("woff2"); }
:root {
  --text: #fafaf8; --text-2: rgba(250, 250, 248, 0.72); --text-3: rgba(250, 250, 248, 0.5);
  --glass: rgba(30, 40, 29, 0.62); --rim: rgba(255, 255, 255, 0.12); --cool: #b9d6c4; --warm: #e6d3a3; --brand: #4a5d48; --brand-deep: #1f2a1e;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
.wa { display: block; margin-top: 14px; text-align: center; color: var(--brand-deep); background: #fafaf8; border-radius: 999px; padding: 12px; font-weight: 650; text-decoration: none; }
.logo { display: block; height: 64px; width: auto; margin-bottom: 18px; }
body {
  background: #141a13; color: var(--text); font-family: "Inter", system-ui, sans-serif; font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100vh;
}
.bg { position: fixed; top: 0; left: 0; right: 0; height: 100vh; background-size: cover; background-position: center; z-index: -2; }
.bg::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(180deg, rgba(20, 26, 19, 0.1) 0%, rgba(20, 26, 19, 0.55) 38%, #141a13 72%); }
main { max-width: 560px; margin: 0 auto; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }
.hero { padding: 38vh 4px 20px; }
.eyebrow { font-size: 12px; font-weight: 650; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(255, 255, 255, 0.8); }
h1 { margin-top: 6px; font-size: 32px; line-height: 1.12; font-family: "Playfair Display", Georgia, serif; font-weight: 600; letter-spacing: -0.005em; text-wrap: balance; }
.sub { margin-top: 8px; font-size: 16px; color: rgba(255, 255, 255, 0.85); }
.card {
  margin-top: 12px; padding: 18px; border-radius: 22px; background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  box-shadow: inset 0 0 0 1px var(--rim);
}
.k { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
.k svg { width: 18px; height: 18px; }
.big { margin-top: 8px; font-size: 24px; font-weight: 680; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.muted { color: var(--text-2); font-size: 15px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
button {
  font: inherit; font-size: 15px; font-weight: 650; color: var(--brand-deep); background: #fafaf8; border: 0; border-radius: 999px;
  padding: 10px 16px; min-height: 44px; cursor: pointer; flex: none;
}
button.ghost { background: rgba(255, 255, 255, 0.12); color: #fff; }
button:active { transform: scale(0.97); }
.kv { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
.kv:last-child { border-bottom: 0; }
.kv b { font-size: 20px; letter-spacing: 0.04em; }
.zone { padding: 14px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
.zone:last-child { border-bottom: 0; padding-bottom: 0; }
.zone .row + .row { margin-top: 10px; }
.zone .name { font-size: 18px; font-weight: 650; }
.zone .now { font-size: 14px; color: var(--text-2); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; padding: 0; font-size: 22px; line-height: 1; }
.stepper .sp { min-width: 64px; text-align: center; font-size: 26px; font-weight: 300; letter-spacing: -0.02em; }
.toggle { position: relative; width: 56px; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, 0.18); padding: 0; min-height: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: transform 200ms; }
.toggle.on { background: #7fa37a; }
.toggle.on.heat { background: #e8914a; }
.toggle.on::after { transform: translateX(22px); }
details { border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
details:last-child { border-bottom: 0; }
summary { list-style: none; padding: 14px 0; font-size: 17px; font-weight: 620; display: flex; justify-content: space-between; cursor: pointer; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--text-3); font-weight: 400; font-size: 22px; line-height: 1; }
details[open] summary::after { content: "−"; }
details p { padding: 0 0 14px; color: rgba(255, 255, 255, 0.86); font-size: 15px; }
.group { margin-top: 14px; font-size: 12px; font-weight: 650; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-3); }
.cats { display: flex; gap: 8px; overflow-x: auto; margin: 12px -18px 4px; padding: 0 18px 4px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats button { padding: 8px 14px; min-height: 38px; }
.pl { padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
.pl:last-child { border-bottom: 0; }
.pl b { display: block; font-size: 17px; }
.pl p { font-size: 15px; color: rgba(255, 255, 255, 0.84); }
.pl a { color: var(--cool); font-size: 14px; text-decoration: none; font-weight: 600; }
.pl em { font-style: normal; color: var(--warm); font-size: 14px; }
ol { padding-left: 22px; margin-top: 8px; }
ol li { padding: 4px 0; font-size: 15px; }
.fc { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; }
.fc div { flex: 1; min-width: 58px; text-align: center; padding: 8px 4px; border-radius: 14px; background: rgba(255, 255, 255, 0.07); }
.fc b { display: block; font-size: 13px; color: var(--text-2); }
.fc svg { width: 26px; height: 26px; margin: 4px 0; }
.fc span { display: block; font-size: 14px; font-weight: 620; }
.fc span i { font-style: normal; color: var(--text-3); }
label { display: block; margin-top: 12px; font-size: 13px; color: var(--text-2); }
input { width: 100%; margin-top: 4px; font: inherit; font-size: 16px; color: #fff; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 12px; padding: 12px; }
input[type=date] { color-scheme: dark; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); opacity: 0; transition: all 220ms; background: #fff; color: #111; padding: 10px 18px; border-radius: 999px; font-weight: 650; font-size: 15px; pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.foot { margin-top: 24px; text-align: center; font-size: 13px; color: var(--text-3); }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main id="main"><div class="hero"><h1>Loading</h1></div></main>
<div class="toast" id="toast"></div>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search), HOME = q.get("home") || "", KEY = q.get("key") || "";
  var S = null, AC = null, WX = null, cat = 0;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function api(p, body) {
    var u = "/api/" + p + "?home=" + encodeURIComponent(HOME) + (KEY ? "&key=" + encodeURIComponent(KEY) : "");
    return fetch(u, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}).then(function (r) { return r.json(); });
  }
  function toast(m) { var t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("on"); }, 1800); }
  var DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function d8(iso) { var p = String(iso).slice(0, 10).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dshort(iso) { var d = d8(iso); return DAYS[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()]; }
  function t12(h) { if (!h) return ""; var p = h.split(":"), x = +p[0]; return (x % 12 || 12) + (p[1] === "00" ? "" : ":" + p[1]) + (x < 12 ? "am" : "pm"); }
  function wx(c) {
    c = +c;
    var s = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"';
    if (c <= 1) return "<svg " + s + '><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
    if (c <= 3 || c === 45 || c === 48) return "<svg " + s + '><path d="M7 19h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 12.6 3.3 3.3 0 0 0 7 19z"/></svg>';
    return "<svg " + s + '><path d="M7 15h10a4 4 0 0 0 .6-8A6 6 0 0 0 6.2 8.6 3.3 3.3 0 0 0 7 15z"/><path d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/></svg>';
  }
  var IC = {
    wifi: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2.5 8.5a14 14 0 0 1 19 0"/><path d="M5.5 12a9.5 9.5 0 0 1 13 0"/><path d="M8.6 15.4a5 5 0 0 1 6.8 0"/></svg>',
    climate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/></svg>',
    key: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2"/></svg>',
    guide: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5z"/></svg>',
    local: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21s-6.5-6.2-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 14.8 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></svg>',
    out: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10"/></svg>',
    sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/></svg>'
  };

  function render() {
    var st = S.stay || {}, h = "", g = st.guest;
    $("bg").style.backgroundImage = "url(homes/" + S.photos.hero + ".jpg)";
    document.title = S.name;
    var title = S.mode === "guest" ? (g ? "Welcome, " + g : "Welcome") : st.active ? (st.phase === "open" ? "Welcome to " + S.name : "Welcome" + (g ? ", " + g : "")) : "Welcome to " + S.name;
    var sub = S.mode === "guest" ? (st.to ? "Here until " + dshort(st.to) + ". Make yourself at home." : "Make yourself at home.")
      : st.phase === "open" ? "Make yourself at home." + (S.checkout_time ? " Check-out is by " + t12(S.checkout_time) + "." : "")
      : st.active ? dshort(st.from) + " to " + dshort(st.to) + " · check-out " + t12(S.checkout_time) : "Your stay details show here when you arrive.";
    h += '<div class="hero">' + (S.brand && S.brand.logo ? '<img class="logo" src="' + esc(S.brand.logo) + '" alt="' + esc(S.brand.name || "") + '">' : "") + '<p class="eyebrow">' + esc(S.mode === "guest" && S.host ? "Staying with " + S.host : S.name) + "</p><h1>" + esc(title) + '</h1><p class="sub">' + esc(sub) + "</p></div>";

    if (S.wifi && S.wifi.ssid) {
      h += '<section class="card"><div class="k">' + IC.wifi + 'Wi-Fi</div><div class="row"><div><p class="muted" style="margin-top:8px">' + esc(S.wifi.ssid) +
        '</p><p class="big" style="margin-top:2px">' + esc(S.wifi.password || "No password needed") + '</p></div>' + (S.wifi.password ? '<button id="copy">Copy</button>' : "") + '</div></section>';
    }
    if (S.has_climate) h += '<section class="card" id="climate"></section>';
    if ((S.access || []).length) {
      h += '<section class="card"><div class="k">' + IC.key + "Getting in</div>" + S.access.map(function (a) { return '<div class="kv"><span>' + esc(a.label) + "</span><b>" + esc(a.code) + "</b></div>"; }).join("") + "</section>";
    }
    h += '<section class="card" id="weather"></section>';
    if (S.welcome && S.mode !== "guest") h += '<section class="card"><p style="font-size:17px">' + esc(S.welcome) + "</p>" + (S.host ? '<p class="muted" style="margin-top:8px">' + esc(S.host) + ", your host</p>" : "") + "</section>";

    var guide = "";
    if ((S.notes || []).length) guide += '<p class="group">From ' + esc(S.host || "your host") + "</p>" + S.notes.map(det).join("");
    if (S.rules.length) guide += '<p class="group">House rules</p>' + S.rules.map(det).join("");
    var grp = null;   // the Concierge's FAQ categories come through as groups
    S.howto.forEach(function (x) {
      var g2 = x.group || "How things work";
      if (g2 !== grp) { grp = g2; guide += '<p class="group">' + esc(g2) + "</p>"; }
      guide += det(x);
    });
    if (guide) h += '<section class="card"><div class="k">' + IC.guide + (S.mode === "guest" ? "How things work" : "House guide") + "</div>" + guide + "</section>";
    if (S.local.length) h += '<section class="card"><div class="k">' + IC.local + 'Around here</div><div class="cats" id="cats"></div><div id="places"></div></section>';
    if (S.mode !== "guest" && st.active && (S.checkout.steps || []).length) {
      h += '<section class="card"><div class="k">' + IC.out + "Check-out by " + t12(S.checkout_time) + "</div><ol>" + S.checkout.steps.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></section>";
    }
    if (S.emergency.length) h += '<section class="card"><div class="k">Emergency</div>' + S.emergency.map(function (e) {
      return '<div class="kv"><span style="max-width:70%">' + esc(e.name) + "</span>" + (e.phone ? '<b><a style="color:#fff;text-decoration:none" href="tel:' + esc(String(e.phone).replace(/[^0-9+]/g, "")) + '">' + esc(e.phone) + "</a></b>" : "") + "</div>";
    }).join("") + (S.whatsapp ? '<a class="wa" href="https://wa.me/' + esc(S.whatsapp) + '">Message ' + esc(S.host || "us") + " on WhatsApp</a>" : "") + "</section>";
    if (KEY) h += hostCard();
    h += '<p class="foot">' + esc(S.name) + " · this page works on the home Wi-Fi</p>";
    $("main").innerHTML = h;

    var c = $("copy");
    if (c) c.onclick = function () {
      (navigator.clipboard ? navigator.clipboard.writeText(S.wifi.password) : Promise.reject()).then(function () { toast("Password copied"); }, function () { toast("Hold the password to copy it"); });
    };
    drawClimate(); drawWeather(); drawPlaces();
    if (KEY) bindHost();
  }
  function det(x) { return "<details><summary>" + esc(x.title) + "</summary><p>" + esc(x.body) + "</p></details>"; }

  function drawClimate() {
    var el = $("climate");
    if (!el) return;
    if (!AC) { el.innerHTML = '<div class="k">' + IC.climate + 'Climate</div><p class="muted" style="margin-top:8px">Checking the air conditioning…</p>'; return; }
    if (!AC.connected || !AC.zones.length) { el.innerHTML = '<div class="k">' + IC.climate + 'Climate</div><p class="muted" style="margin-top:8px">The air conditioning is not answering right now.</p>'; return; }
    var heat = AC.mode === "heat";
    el.innerHTML = '<div class="k">' + IC.climate + (S.mode === "guest" ? "Your room" : "Climate") + "</div>" + AC.zones.map(function (z, i) {
      var on = z.on;
      return '<div class="zone"><div class="row"><div><div class="name">' + esc(z.label || z.name) + '</div><div class="now">' + (z.temp != null ? "Now " + z.temp + "°" : "") +
        (on && AC.power === "on" ? (heat ? " · heating" : " · cooling") : "") + '</div></div><button class="toggle' + (on ? " on" : "") + (heat ? " heat" : "") + '" data-t="' + i + '" aria-label="On or off"></button></div>' +
        (z.can_set ? '<div class="row"><span class="muted">Set to</span><div class="stepper"><button class="ghost" data-m="' + i + '" aria-label="Cooler">−</button><span class="sp">' + (z.setpoint != null ? z.setpoint + "°" : "−") +
          '</span><button class="ghost" data-p="' + i + '" aria-label="Warmer">+</button></div></div>' : "") + "</div>";
    }).join("") + '<p class="muted" style="margin-top:12px;font-size:13px">' + esc(AC.simulated ? "Demo home: nothing real is switched." : AC.preview ? "Preview: changes show but are not sent to the aircon yet." : "The house is set to " + AC.mode + ".") + "</p>";
    el.onclick = function (e) {
      var b = e.target.closest("button");
      if (!b) return;
      var t = b.getAttribute("data-t"), m = b.getAttribute("data-m"), p = b.getAttribute("data-p");
      var z = AC.zones[+(t || m || p)];
      if (t != null) { z.on = !z.on; send({ zone: z.id, on: z.on }); }
      else if (z && z.can_set) { z.setpoint = Math.max(16, Math.min(30, (z.setpoint || 22) + (p != null ? 1 : -1))); send({ zone: z.id, setpoint: z.setpoint }); }
      drawClimate();
    };
  }
  var sendT = 0, want = {};
  function send(ch) {
    want[ch.zone] = Object.assign(want[ch.zone] || {}, ch);
    clearTimeout(sendT);
    sendT = setTimeout(function () {
      var all = want; want = {};
      Object.keys(all).forEach(function (k) { api("aircon", all[k]).then(function (r) { if (!r.ok) toast(r.error || "That did not work"); setTimeout(loadAc, 1500); }); });
    }, 600);
  }
  function drawWeather() {
    var el = $("weather");
    if (!el || !WX || !WX.ok) { if (el) el.style.display = "none"; return; }
    el.style.display = "";
    var t = new Date(), today = t.getFullYear() + "-" + ("0" + (t.getMonth() + 1)).slice(-2) + "-" + ("0" + t.getDate()).slice(-2);
    el.innerHTML = '<div class="k">' + IC.sun + "Weather in " + esc(WX.place) + '</div><div class="fc">' + WX.days.slice(0, 5).map(function (d) {
      return "<div><b>" + (d.date === today ? "Today" : DAYS[d8(d.date).getDay()]) + "</b>" + wx(d.code) + "<span>" + d.hi + "° <i>" + d.lo + "°</i></span></div>";
    }).join("") + "</div>";
  }
  function drawPlaces() {
    if (!$("cats")) return;
    var area = S.name;
    $("cats").innerHTML = S.local.map(function (c, i) { return '<button class="' + (i === cat ? "" : "ghost") + '" data-c="' + i + '">' + esc(c.category) + "</button>"; }).join("");
    $("places").innerHTML = (S.local[cat].items || []).map(function (p) {
      return '<div class="pl"><b>' + esc(p.name) + "</b><p>" + esc(p.note || "") + (p.distance ? " <em>" + esc(p.distance) + "</em>" : "") +
        '</p><a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(p.name + " " + (p.area || "")) + '" target="_blank" rel="noopener">Open in Maps</a>' +
        (/^https?:\/\//.test(p.book || "") ? ' · <a href="' + esc(p.book) + '" target="_blank" rel="noopener">Book a table</a>' : "") + "</div>";
    }).join("");
    $("cats").onclick = function (e) { var b = e.target.closest("button"); if (b) { cat = +b.getAttribute("data-c"); drawPlaces(); } };
  }

  // the host's own panel: ?key=… from data/private.json
  function hostCard() {
    var st = S.stay || {};
    return '<section class="card"><div class="k">For the host</div><p class="muted" style="margin-top:8px">Set who is staying. The TV and this page update within a minute.</p>' +
      '<label>Guest name<input id="h-guest" value="' + esc(st.guest || "") + '" placeholder="Sarah and Tom"></label>' +
      '<label>Arriving<input id="h-from" type="date" value="' + esc((st.from || "").slice(0, 10)) + '"></label>' +
      '<label>Leaving<input id="h-to" type="date" value="' + esc((st.to || "").slice(0, 10)) + '"></label>' +
      '<div class="row" style="margin-top:14px"><button class="ghost" id="h-clear">Clear</button><button id="h-save">Save</button></div></section>';
  }
  function bindHost() {
    $("h-save").onclick = function () {
      api("stay", { guest: $("h-guest").value, from: $("h-from").value, to: $("h-to").value }).then(function (r) { toast(r.ok ? "Saved" : r.error); if (r.ok) load(); });
    };
    $("h-clear").onclick = function () { api("stay", { guest: "", from: "", to: "" }).then(function (r) { toast(r.ok ? "Cleared" : r.error); if (r.ok) load(); }); };
  }

  function loadAc() { return api("aircon").then(function (a) { if (Object.keys(want).length) return; AC = a; drawClimate(); }); }
  function load() {
    return api("state").then(function (s) {
      if (s.error) { $("main").innerHTML = '<div class="hero"><h1>' + esc(s.error) + "</h1></div>"; return; }
      S = s; HOME = s.id; render();
    });
  }
  load().then(loadAc);
  fetch("/api/weather").then(function (r) { return r.json(); }).then(function (w) { WX = w; drawWeather(); });
  setInterval(loadAc, 20000);
})();
</script>
</body>
</html>
