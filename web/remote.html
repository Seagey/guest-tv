<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0d10">
<title>Guest remote</title>
<style>
@font-face { font-family: "Inter"; font-weight: 100 900; font-display: swap; src: url(fonts/inter-latin-wght-normal.woff2) format("woff2"); }
:root {
  --text: #f7f6f3; --text-2: rgba(247, 246, 243, 0.7); --text-3: rgba(247, 246, 243, 0.48);
  --glass: rgba(28, 28, 34, 0.55); --rim: rgba(255, 255, 255, 0.12); --cool: #9fd8ff; --warm: #ffd89a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #0d0d10; color: var(--text); font-family: "Inter", system-ui, sans-serif; font-size: 16px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; min-height: 100vh;
}
.bg { position: fixed; top: 0; left: 0; right: 0; height: 100vh; background-size: cover; background-position: center; z-index: -2; }
.bg::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: linear-gradient(180deg, rgba(13, 13, 16, 0.15) 0%, rgba(13, 13, 16, 0.6) 30%, #0d0d10 60%); }
main { max-width: 560px; margin: 0 auto; padding: 0 16px calc(32px + env(safe-area-inset-bottom)); }
.hero { padding: 24vh 4px 16px; }
h1 { font-size: 32px; line-height: 1.12; font-weight: 700; letter-spacing: -0.025em; }
.sub { margin-top: 8px; font-size: 16px; color: rgba(255, 255, 255, 0.85); }
.card {
  margin-top: 12px; padding: 18px; border-radius: 22px; background: var(--glass);
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  box-shadow: inset 0 0 0 1px var(--rim);
}
.k { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 650; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-2); }
.muted { color: var(--text-2); font-size: 15px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
button {
  font: inherit; font-size: 15px; font-weight: 650; color: #111; background: #fff; border: 0; border-radius: 999px;
  padding: 10px 16px; min-height: 44px; cursor: pointer; flex: none;
}
button.ghost { background: rgba(255, 255, 255, 0.12); color: #fff; }
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.5; }
/* ask */
.ask { display: flex; gap: 8px; margin-top: 12px; }
.ask input {
  flex: 1; min-width: 0; font: inherit; font-size: 16px; color: #fff; background: rgba(255, 255, 255, 0.1); border: 0;
  border-radius: 999px; padding: 0 16px; min-height: 48px; outline: none; box-shadow: inset 0 0 0 1px var(--rim);
}
.ask input::placeholder { color: var(--text-3); }
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 12px -18px 0; padding: 0 18px 2px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { padding: 8px 14px; min-height: 38px; font-weight: 560; }
.reply { margin-top: 14px; font-size: 17px; line-height: 1.5; }
.reply:empty { display: none; }
.done { margin-top: 6px; font-size: 14px; color: var(--cool); }
.thinking { color: var(--text-2); }
.thinking::after { content: ""; display: inline-block; width: 1em; animation: dots 1.2s steps(4) infinite; overflow: hidden; vertical-align: bottom; }
@keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
/* pad */
.pad { position: relative; width: 236px; height: 236px; margin: 16px auto 4px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1px var(--rim); }
.pad button { position: absolute; width: 72px; height: 72px; border-radius: 50%; background: transparent; color: #fff; padding: 0; font-size: 22px; }
.pad .u { top: 4px; left: 82px; } .pad .d { bottom: 4px; left: 82px; } .pad .l { left: 4px; top: 82px; } .pad .r { right: 4px; top: 82px; }
.pad .ok { top: 68px; left: 68px; width: 100px; height: 100px; background: rgba(255, 255, 255, 0.16); font-size: 17px; }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.keys button { padding: 10px 0; }
.apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.apps button { padding: 12px 6px; font-size: 14px; border-radius: 16px; }
/* room */
.zone .name { font-size: 18px; font-weight: 650; }
.zone .now { font-size: 14px; color: var(--text-2); }
.zone .row + .row { margin-top: 12px; }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button { width: 44px; padding: 0; font-size: 22px; line-height: 1; }
.stepper .sp { min-width: 64px; text-align: center; font-size: 26px; font-weight: 300; }
.toggle { position: relative; width: 56px; height: 34px; border-radius: 17px; background: rgba(255, 255, 255, 0.18); padding: 0; min-height: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: transform 200ms; }
.toggle.on { background: #4aa8e8; }
.toggle.on::after { transform: translateX(22px); }
.zone .sub2 { margin-top: 14px; padding-top: 14px; box-shadow: inset 0 1px 0 var(--rim); }
.bright { width: 100%; margin-top: 12px; accent-color: var(--warm); }
.links { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.links:empty { display: none; }
.links a { display: block; text-align: center; color: #111; background: #fff; border-radius: 999px; padding: 12px; font-weight: 650; text-decoration: none; }
.links a.ghost { background: rgba(255, 255, 255, 0.12); color: #fff; }
.confirm { margin-top: 12px; padding: 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 0 0 1px var(--rim); }
.confirm .t { font-weight: 650; font-size: 17px; }
.confirm label { display: block; margin-top: 10px; font-size: 13px; color: var(--text-2); }
.confirm input { width: 100%; margin-top: 4px; font: inherit; font-size: 16px; color: #fff; background: rgba(255, 255, 255, 0.1); border: 0; border-radius: 12px; padding: 10px 12px; outline: none; }
.confirm .row { margin-top: 12px; }
.confirm .fine { margin-top: 10px; font-size: 13px; color: var(--text-3); }
a.info { display: block; text-align: center; color: #111; background: #fff; border-radius: 999px; padding: 13px; font-weight: 650; text-decoration: none; margin-top: 12px; }
/* your stay */
.kv { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 0; box-shadow: inset 0 -1px 0 var(--rim); }
.kv:last-child { box-shadow: none; }
.kv span { color: var(--text-2); font-size: 15px; }
.kv b { font-size: 18px; font-weight: 650; letter-spacing: 0.02em; text-align: right; }
.kv b.code { font-variant-numeric: tabular-nums; letter-spacing: 0.12em; }
.nights { margin-top: 6px; font-size: 22px; font-weight: 650; letter-spacing: -0.01em; }
details { margin-top: 12px; border-radius: 16px; background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 1px var(--rim); }
summary { list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 650; display: flex; justify-content: space-between; }
summary::-webkit-details-marker { display: none; }
summary::after { content: "+"; color: var(--text-2); font-weight: 400; }
details[open] summary::after { content: "−"; }
details .in { padding: 0 16px 14px; }
details .rule + .rule { margin-top: 10px; }
details .rule b { display: block; font-size: 15px; }
details .rule p, details li { font-size: 15px; color: var(--text-2); }
details ol { padding-left: 20px; }
details li + li { margin-top: 4px; }
/* pool and speakers */
.big { font-size: 40px; line-height: 1.1; font-weight: 300; letter-spacing: -0.02em; }
.spk + .spk { margin-top: 14px; padding-top: 14px; box-shadow: inset 0 1px 0 var(--rim); }
.spk .title { font-size: 14px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }
.spk .ctl { display: flex; gap: 8px; }
.spk .ctl button { width: 44px; padding: 0; }
.vol { width: 100%; margin-top: 10px; accent-color: #fff; }
.note { margin-top: 18px; font-size: 13px; color: var(--text-3); text-align: center; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: rgba(40, 40, 46, 0.95); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity 200ms; pointer-events: none; }
.toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main id="main">
  <div class="hero">
    <h1 id="title">Guest remote</h1>
    <p class="sub" id="sub"></p>
  </div>
  <p class="card muted" id="msg" hidden></p>
</main>
<div class="toast" id="toast"></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var Q = new URLSearchParams(location.search), HOME = Q.get("home") || "guest", CODE = Q.get("c") || "";
  var R = null, busy = false;
  var DAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function api(path, body) {
    var u = path + "?home=" + encodeURIComponent(HOME) + "&c=" + encodeURIComponent(CODE);
    return fetch(u, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {})
      .then(function (r) { return r.json().then(function (j) { j._status = r.status; return j; }); });
  }
  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("show"); }, 1600); }
  function t12(iso) { var d = new Date(iso), h = d.getHours(), m = d.getMinutes(); return (h % 12 || 12) + (m ? ":" + String(m).padStart(2, "0") : "") + (h < 12 ? "am" : "pm"); }
  function say(msg) { $("msg").hidden = false; $("msg").textContent = msg; }

  function chips() {
    var c = ["Something funny to watch"], apps = (R.apps || []).map(function (a) { return a.id; }), rooms = R.rooms || [];
    if (apps.indexOf("spotify") >= 0) c.push("Put on some chill music");
    if (rooms.some(function (r) { return r.aircon; })) c.push("Make my room cooler");
    if (rooms.some(function (r) { return r.lights; })) c.push("Dim the lights");
    if (R.pool && R.pool.can_heat) c.push("Heat the pool");
    if ((R.speakers || []).length) c.push("Music on the deck");
    c.push("Will it rain tomorrow?");
    c.push((R.places || []).length ? "Where's good for dinner?" : "Where's good for breakfast?");
    return c;
  }
  function draw() {
    var stay = R.mode !== "guest";
    $("title").textContent = R.guest ? "Hi " + R.guest : "Guest remote";
    $("sub").textContent = stay ? "Your guest remote" + (R.place ? " for " + R.place : "") + (R.until ? ", here until " + DAYS[new Date(R.until).getDay()] + " " + t12(R.until) : "") + "."
      : (R.guest ? "Your guest remote: the TV, your room and the local area." : "Your TV, your room and the local area.");
    var h = "";
    h += '<section class="card"><div class="k">Ask</div>' +
      '<form class="ask" id="ask"><input id="q" maxlength="300" placeholder="Put on something funny…" autocomplete="off" enterkeyhint="send"><button id="go">Ask</button></form>' +
      '<div class="chips">' + chips().map(function (c) {
        return '<button class="ghost" data-q="' + esc(c) + '">' + esc(c) + "</button>"; }).join("") + "</div>" +
      '<div class="reply" id="reply"></div><div class="done" id="done"></div><div class="links" id="links"></div><div id="cards"></div></section>';
    if (stay && R.stay) h += stayCard(R.stay);
    h += '<section class="card"><div class="k">TV</div>' + (R.tv_on ? "" : '<p class="muted" style="margin-top:8px">The TV looks off. Turn it on with its own remote first.</p>') +
      '<div class="pad"><button class="u" data-k="up" aria-label="Up">▲</button><button class="l" data-k="left" aria-label="Left">◀</button><button class="ok" data-k="ok">OK</button><button class="r" data-k="right" aria-label="Right">▶</button><button class="d" data-k="down" aria-label="Down">▼</button></div>' +
      '<div class="keys"><button class="ghost" data-k="back">Back</button><button class="ghost" data-k="home">Home</button><button class="ghost" data-k="play_pause">Play/Pause</button>' +
      '<button class="ghost" data-k="volume_down">Vol −</button><button class="ghost" data-k="mute">Mute</button><button class="ghost" data-k="volume_up">Vol +</button></div></section>';
    if (R.apps.length) h += '<section class="card"><div class="k">Apps</div><div class="apps">' + R.apps.map(function (a) {
      return '<button class="ghost" data-app="' + esc(a.id) + '">' + esc(a.name) + "</button>"; }).join("") + "</div></section>";
    (R.rooms || []).forEach(function (r, i) { h += roomCard(r, i); });
    if (R.pool) h += poolCard(R.pool);
    if ((R.speakers || []).length) h += speakersCard(R.speakers);
    h += '<a class="info" href="/p/?home=' + encodeURIComponent(HOME) + '">Wi-Fi, house info and local picks</a>' +
      '<p class="note">This remote only works on this home\'s Wi-Fi' + (stay ? ", and only during your stay" : "") + ".</p>";
    var main = $("main");
    while (main.children.length > 2) main.removeChild(main.lastChild);
    main.insertAdjacentHTML("beforeend", h);
    $("ask").onsubmit = function (e) { e.preventDefault(); ask($("q").value); };
  }

  function d8(iso) { var p = String(iso).slice(0, 10).split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dayShort(iso) { var d = d8(iso); return DAYS[d.getDay()].slice(0, 3) + " " + d.getDate() + " " + ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][d.getMonth()]; }
  function hm12(hhmm) { var p = String(hhmm || "10:00").split(":"), h = +p[0]; return (h % 12 || 12) + (p[1] && p[1] !== "00" ? ":" + p[1] : "") + (h < 12 ? "am" : "pm"); }
  function stayCard(s) {
    var h = '<section class="card"><div class="k">Your stay</div>';
    if (s.from) h += '<div class="nights">' + (s.night ? "Night " + s.night + " of " + s.nights : s.nights + " nights") + "</div>" +
      '<div class="kv"><span>Check-in</span><b>' + dayShort(s.from) + ", " + hm12(s.checkin) + "</b></div>" +
      '<div class="kv"><span>Check-out</span><b>' + dayShort(s.to) + ", " + hm12(s.checkout) + "</b></div>";
    if (s.wifi && s.wifi.ssid) h += '<div class="kv"><span>Wi-Fi</span><b>' + esc(s.wifi.ssid) + '</b></div><div class="kv"><span>Password</span><b>' + esc(s.wifi.password) + "</b></div>";
    (s.access || []).forEach(function (a) { h += '<div class="kv"><span>' + esc(a.label) + '</span><b class="code">' + esc(a.code) + "</b></div>"; });
    if ((s.rules || []).length) h += "<details><summary>House rules</summary><div class=\"in\">" + s.rules.map(function (r) {
      return '<div class="rule"><b>' + esc(r.title) + "</b><p>" + esc(r.body) + "</p></div>"; }).join("") + "</div></details>";
    if ((s.checkout_steps || []).length) h += "<details><summary>Before you leave</summary><div class=\"in\"><ol>" + s.checkout_steps.map(function (x) {
      return "<li>" + esc(x) + "</li>"; }).join("") + "</ol></div></details>";
    return h + "</section>";
  }
  function poolCard(p) {
    return '<section class="card" id="pool"><div class="k">' + esc(p.label || "Pool") + '</div><div class="row" style="margin-top:10px"><div><div class="big">' +
      (p.temp != null ? p.temp + "°" : "−") + '</div><div class="now muted">Water now' + (p.can_heat ? ", heater <span class=\"pl-name\">" + (p.heater ? "on" : "off") + "</span>" : "") + "</div></div>" +
      (p.can_heat ? '<button class="toggle pl-on' + (p.heater ? " on" : "") + '" data-pool="1" aria-label="Pool heater on or off"></button>' : "") + "</div></section>";
  }
  function speakersCard(list) {
    return '<section class="card"><div class="k">Speakers</div>' + list.map(function (x, i) {
      return '<div class="spk" data-spk="' + i + '" style="margin-top:12px"><div class="row"><div><div class="name" style="font-size:18px;font-weight:650">' + esc(x.label) + '</div><div class="title">' +
        esc(x.playing ? x.title || "Playing" : "Paused") + '</div></div><div class="ctl"><button class="ghost" data-sa="' + (x.playing ? "pause" : "play") + '" data-s="' + i + '" aria-label="Play or pause">' + (x.playing ? "❚❚" : "▶") + '</button>' +
        '<button class="ghost" data-sa="next" data-s="' + i + '" aria-label="Next">⏭</button></div></div>' +
        '<input class="vol" type="range" min="0" max="100" step="5" value="' + (x.volume || 0) + '" data-sv="' + i + '" aria-label="Volume"></div>';
    }).join("") + "</section>";
  }
  function roomCard(r, i) {
    var h = '<section class="card zone" data-room="' + i + '"><div class="k">' + esc(r.label) + "</div>", a = r.aircon, l = r.lights;
    if (a) h += '<div class="row" style="margin-top:10px"><div><div class="name">Aircon <span class="ac-name">' + (a.on ? "on" : "off") + '</span></div><div class="now">It\'s ' + esc(a.temp) + '° in there</div></div>' +
      '<button class="toggle ac-on' + (a.on ? " on" : "") + '" data-ac="' + i + '" aria-label="Aircon on or off"></button></div>' +
      '<div class="row"><span class="muted">Set to</span><div class="stepper"><button class="ghost" data-sp="-1" data-r="' + i + '">−</button><span class="sp">' + esc(a.setpoint) + '°</span><button class="ghost" data-sp="1" data-r="' + i + '">+</button></div></div>';
    if (l) h += '<div class="' + (a ? "sub2" : "") + '"><div class="row"' + (a ? "" : ' style="margin-top:10px"') + '><div class="name">Lights <span class="li-name">' + (l.on ? "on" : "off") + '</span></div>' +
      '<button class="toggle li-on' + (l.on ? " on" : "") + '" data-li="' + i + '" aria-label="Lights on or off"></button></div>' +
      '<input class="bright" type="range" min="1" max="100" value="' + (l.brightness || 80) + '" data-br="' + i + '" aria-label="Brightness"></div>';
    return h + "</section>";
  }
  function showLinks(links) {
    $("links").innerHTML = (links || []).map(function (k, i) {
      return '<a href="' + esc(k.url) + '" target="_blank" rel="noopener"' + (i ? ' class="ghost"' : "") + ">" + esc(k.label) + "</a>"; }).join("");
  }
  var CARDS = {};
  function showCards(cards) {
    CARDS = {};
    $("cards").innerHTML = (cards || []).map(function (c) {
      CARDS[c.token] = c;
      var f = c.fields, h = '<div class="confirm" data-card="' + esc(c.token) + '"><div class="t">' + esc(c.title) + "</div>";
      if (c.kind === "book") {
        [["people", "People", "number"], ["when", "Day and time", "text"], ["name", "Name for the booking", "text"], ["phone", "Mobile", "tel"], ["email", "Email (if they ask for one)", "email"]].forEach(function (x) {
          h += "<label>" + x[1] + '<input data-f="' + x[0] + '" type="' + x[2] + '" value="' + esc(f[x[0]] == null ? "" : f[x[0]]) + '"></label>'; });
        h += '<p class="fine">The agent fills in their booking page with these details. It never pays or makes an account.</p>';
      } else if (c.params) {
        h += '<p class="muted" style="margin-top:6px">' + esc(Object.keys(c.params).map(function (k) { return k + ": " + c.params[k]; }).join(", ")) + "</p>";
      }
      return h + '<div class="row"><button class="ghost" data-cancel="' + esc(c.token) + '">Cancel</button><button data-ok="' + esc(c.token) + '">' + (c.kind === "book" ? "Book it" : "Confirm") + "</button></div></div>";
    }).join("");
  }
  function doConfirm(tok) {
    var el = document.querySelector('[data-card="' + tok + '"]'), fields = {};
    if (el) el.querySelectorAll("input[data-f]").forEach(function (i) { fields[i.dataset.f] = i.value; });
    $("cards").innerHTML = ""; $("reply").innerHTML = '<span class="thinking">' + (CARDS[tok] && CARDS[tok].kind === "book" ? "Booking. This can take a minute or two" : "Working on it") + "</span>";
    api("/api/r/confirm", { token: tok, fields: fields }).then(function (r) {
      if (r._status === 403) return ended(r.error);
      $("reply").textContent = r.say || (r.ok ? "Done." : "That didn't work.");
      $("done").textContent = r.ref ? "Reference: " + r.ref : "";
      showLinks(r.links);
    }).catch(function () { $("reply").textContent = "Couldn't reach the house. Are you on the Wi-Fi?"; });
  }

  function ask(text) {
    text = (text || "").trim();
    if (!text || busy) return;
    busy = true; $("go").disabled = true; $("q").value = "";
    $("reply").innerHTML = '<span class="thinking">' + esc(text) + " · thinking</span>"; $("done").textContent = ""; showLinks([]); showCards([]);
    api("/api/r/ask", { text: text }).then(function (r) {
      if (r._status === 403) return ended(r.error);
      $("reply").textContent = r.say || "Done.";
      $("done").textContent = (r.done || []).join(" · ");
      showLinks(r.links); showCards(r.confirm);
      if ((R.rooms || []).length) refresh();
    }).catch(function () { $("reply").textContent = "Couldn't reach the house. Are you on the Wi-Fi?"; })
      .then(function () { busy = false; var g = $("go"); if (g) g.disabled = false; });
  }
  function ended(m) { while ($("main").children.length > 2) $("main").removeChild($("main").lastChild); say(m || "This remote has ended. Scan the code on the TV again."); }

  document.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.dataset.q) return ask(b.dataset.q);
    if (b.dataset.k) return api("/api/r/key", { key: b.dataset.k }).then(function (r) { if (r._status === 403) ended(r.error); else if (r.ok === false) toast(r.error); });
    if (b.dataset.app) return api("/api/r/app", { app: b.dataset.app }).then(function (r) { toast(r.ok ? "Opening" : (r.error || "Couldn't open it")); });
    if (b.dataset.ok) return doConfirm(b.dataset.ok);
    if (b.dataset.pool) return api("/api/r/pool", { heater: !R.pool.heater }).then(function (r) { if (r.ok === false) toast(r.error); else toast("Pool heater " + (R.pool.heater ? "off" : "on")); refresh(); });
    if (b.dataset.sa) { var sp = R.speakers[b.dataset.s]; return api("/api/r/speaker", { room: sp.id, action: b.dataset.sa }).then(function (r) { if (r.ok === false) toast(r.error); refresh(); }); }
    if (b.dataset.cancel) { $("cards").innerHTML = ""; return; }
    if (b.dataset.ac) { var ra = R.rooms[b.dataset.ac]; return api("/api/r/aircon", { room: ra.id, on: !ra.aircon.on }).then(function (r) { if (r.ok === false) toast(r.error); refresh(); }); }
    if (b.dataset.li) { var rl = R.rooms[b.dataset.li]; return api("/api/r/lights", { room: rl.id, on: !rl.lights.on }).then(function (r) { if (r.ok === false) toast(r.error); refresh(); }); }
    if (b.dataset.sp) {
      var rs = R.rooms[b.dataset.r], ac = rs.aircon;
      var sp = Math.max(ac.min, Math.min(ac.max, Math.round(ac.setpoint + Number(b.dataset.sp))));
      ac.setpoint = sp; b.parentNode.querySelector(".sp").textContent = sp + "°";
      clearTimeout(ask.sp); ask.sp = setTimeout(function () { api("/api/r/aircon", { room: rs.id, setpoint: sp }).then(function (r) { if (r.ok === false) toast(r.error); }); }, 700);
    }
  });

  document.addEventListener("change", function (e) {
    var el = e.target;
    if (el.dataset && el.dataset.sv != null) {
      var sp = R.speakers[el.dataset.sv];
      return api("/api/r/speaker", { room: sp.id, action: "volume", volume: Number(el.value) }).then(function (x) { if (x.ok === false) toast(x.error); });
    }
    if (!el.dataset || el.dataset.br == null) return;
    var r = R.rooms[el.dataset.br];
    api("/api/r/lights", { room: r.id, brightness: Number(el.value) }).then(function (x) { if (x.ok === false) toast(x.error); refresh(); });
  });

  function refresh() {
    return api("/api/r").then(function (r) {
      if (r._status === 403) return ended(r.error);
      var first = !R; R = r;
      if (first) return draw();
      var pe = $("pool");
      if (pe && R.pool) { pe.querySelector(".big").textContent = R.pool.temp != null ? R.pool.temp + "°" : "−"; var t = pe.querySelector(".pl-on"); if (t) { t.classList.toggle("on", !!R.pool.heater); pe.querySelector(".pl-name").textContent = R.pool.heater ? "on" : "off"; } }
      (R.speakers || []).forEach(function (x, i) {
        var el = document.querySelector('[data-spk="' + i + '"]'); if (!el) return;
        el.querySelector(".title").textContent = x.playing ? x.title || "Playing" : "Paused";
        var pb = el.querySelector("[data-sa=play],[data-sa=pause]"); pb.dataset.sa = x.playing ? "pause" : "play"; pb.textContent = x.playing ? "❚❚" : "▶";
      });
      (R.rooms || []).forEach(function (r, i) {
        var el = document.querySelector('[data-room="' + i + '"]'); if (!el) return;
        if (r.aircon && el.querySelector(".ac-on")) { el.querySelector(".ac-on").classList.toggle("on", r.aircon.on); el.querySelector(".ac-name").textContent = r.aircon.on ? "on" : "off"; }
        if (r.lights && el.querySelector(".li-on")) { el.querySelector(".li-on").classList.toggle("on", r.lights.on); el.querySelector(".li-name").textContent = r.lights.on ? "on" : "off"; }
      });
    }).catch(function () { say("Couldn't reach the house. Join the Wi-Fi first, then scan the code on the TV again."); });
  }
  fetch("/api/state?home=" + encodeURIComponent(HOME)).then(function (r) { return r.json(); }).then(function (S) {
    if (S.photos && S.photos.hero) $("bg").style.backgroundImage = "url(homes/" + S.photos.hero + ".jpg)";
  }).catch(function () {});
  refresh();
})();
</script>
</body>
</html>
